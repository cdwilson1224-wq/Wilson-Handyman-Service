<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Wilson Handyman Service Invoice</title>
<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17212b;--muted:#66717d;--accent:#1d5d49;--line:#d9dee3;--danger:#8a2626}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}header{background:#17212b;color:#fff;padding:20px 16px}header h1{font-size:22px;margin:0}header p{margin:4px 0 0;color:#cbd2d8}.wrap{max-width:760px;margin:auto;padding:12px}.card{background:#fff;border-radius:14px;padding:15px;margin-bottom:12px;box-shadow:0 1px 4px #0001}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}label{display:block;font-size:12px;color:var(--muted);margin:0 0 4px}input,textarea{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff}textarea{min-height:72px}.service{display:grid;grid-template-columns:1fr 120px 40px;gap:8px;margin-bottom:8px}.btns{display:flex;gap:8px;flex-wrap:wrap}button{border:0;border-radius:10px;padding:12px 14px;font-weight:700;background:var(--accent);color:#fff}button.secondary{background:#e7ecef;color:var(--ink)}button.danger{background:#f3dddd;color:var(--danger)}.total{display:flex;justify-content:space-between;font-size:21px;font-weight:800;border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.small{font-size:12px;color:var(--muted)}.historyItem{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px}.brandPrint{display:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.service{grid-template-columns:1fr 105px 38px}}@media print{header,.noPrint,#historyCard{display:none!important}body{background:#fff}.wrap{max-width:none;padding:0}.card{box-shadow:none;border-radius:0;margin:0;padding:10px}.brandPrint{display:block;font-size:26px;font-weight:800;margin-bottom:18px}input,textarea{border:0;padding:2px}.service{grid-template-columns:1fr 120px}.service button{display:none}.card{break-inside:avoid}}
</style></head><body>
<header><h1>WHS Invoice</h1><p>Wilson Handyman Service</p></header><main class="wrap">
<div class="card"><div class="brandPrint">Wilson Handyman Service<br><span style="font-size:13px;font-weight:500">INVOICE</span></div><h2>Invoice</h2><div class="grid"><div><label>Invoice #</label><input id="num"></div><div><label>Date</label><input id="date" type="date"></div></div></div>
<div class="card"><h2>Customer</h2><div class="grid"><div><label>Name</label><input id="customer" placeholder="Customer name"></div><div><label>Phone</label><input id="phone" type="tel" placeholder="Phone number"></div><div class="full"><label>Address or email (optional)</label><input id="contact" placeholder="Address or email"></div></div></div>
<div class="card"><h2>Services</h2><div id="services"></div><button id="addService" type="button" class="secondary noPrint">+ Add Service</button><p class="small noPrint">Enter a description and the amount charged.</p></div>
<div class="card"><label>Notes</label><textarea id="notes">Thank you for your business.</textarea><div class="total"><span>Total</span><span id="total">$0.00</span></div></div>
<div class="card noPrint"><div class="btns"><button id="save" type="button">Save Invoice</button><button id="print" type="button">Create PDF / Print</button><button id="new" type="button" class="secondary">New Invoice</button></div><p class="small">Saved invoices stay in this browser on this device.</p></div>
<div class="card noPrint" id="historyCard"><h2>Saved Invoices</h2><div id="history"></div></div>
</main>
<script>
(function(){
'use strict';
function el(id){return document.getElementById(id)}
function money(v){return '$'+(Number(v)||0).toFixed(2)}
function escapeHtml(s){return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var editing=null;
function addService(desc,amount){
 var row=document.createElement('div'); row.className='service';
 var d=document.createElement('input'); d.className='desc'; d.placeholder='Service description'; d.value=desc||'';
 var a=document.createElement('input'); a.className='amount'; a.type='number'; a.inputMode='decimal'; a.min='0'; a.step='0.01'; a.placeholder='$0.00'; a.value=(amount===undefined?'':amount); a.addEventListener('input',calc);
 var x=document.createElement('button'); x.type='button'; x.className='danger noPrint'; x.textContent='×'; x.addEventListener('click',function(){row.remove();calc()});
 row.appendChild(d);row.appendChild(a);row.appendChild(x);el('services').appendChild(row);calc();
}
function calc(){var t=0;document.querySelectorAll('.amount').forEach(function(a){t+=Number(a.value)||0});el('total').textContent=money(t);return t}
function nextNum(){el('num').value=localStorage.getItem('whsNext')||'1001'}
function invoiceData(){return {id:editing||Date.now(),num:el('num').value,date:el('date').value,customer:el('customer').value,phone:el('phone').value,contact:el('contact').value,notes:el('notes').value,total:calc(),services:Array.from(document.querySelectorAll('.service')).map(function(r){return {desc:r.querySelector('.desc').value,amount:r.querySelector('.amount').value}}).filter(function(s){return s.desc.trim()||Number(s.amount)})}}
function save(){var x=invoiceData();if(!x.customer.trim()){alert('Enter a customer name.');return}var list=JSON.parse(localStorage.getItem('whsInvoices')||'[]');var i=list.findIndex(function(v){return v.id===x.id});if(i>=0)list[i]=x;else{list.unshift(x);var n=Number(x.num);if(Number.isFinite(n))localStorage.setItem('whsNext',String(n+1))}localStorage.setItem('whsInvoices',JSON.stringify(list));editing=x.id;render();alert('Invoice saved on this device.')}
function render(){var list=JSON.parse(localStorage.getItem('whsInvoices')||'[]');el('history').innerHTML='';if(!list.length){el('history').innerHTML='<div class="small">No saved invoices yet.</div>';return}list.forEach(function(x){var r=document.createElement('div');r.className='historyItem';var info=document.createElement('div');info.innerHTML='<b>#'+escapeHtml(x.num)+' · '+escapeHtml(x.customer)+'</b><div class="small">'+escapeHtml(x.date||'')+' · '+money(x.total)+'</div>';var buttons=document.createElement('div');buttons.className='btns';var open=document.createElement('button');open.type='button';open.className='secondary';open.textContent='Open';open.addEventListener('click',function(){load(x.id)});var del=document.createElement('button');del.type='button';del.className='danger';del.textContent='Delete';del.addEventListener('click',function(){removeInvoice(x.id)});buttons.appendChild(open);buttons.appendChild(del);r.appendChild(info);r.appendChild(buttons);el('history').appendChild(r)})}
function load(id){var x=JSON.parse(localStorage.getItem('whsInvoices')||'[]').find(function(v){return v.id===id});if(!x)return;editing=id;el('num').value=x.num||'';el('date').value=x.date||'';el('customer').value=x.customer||'';el('phone').value=x.phone||'';el('contact').value=x.contact||'';el('notes').value=x.notes||'';el('services').innerHTML='';(x.services||[]).forEach(function(s){addService(s.desc,s.amount)});if(!(x.services||[]).length)addService();calc();window.scrollTo(0,0)}
function removeInvoice(id){if(!confirm('Delete this invoice?'))return;var list=JSON.parse(localStorage.getItem('whsInvoices')||'[]').filter(function(v){return v.id!==id});localStorage.setItem('whsInvoices',JSON.stringify(list));render()}
function fresh(){editing=null;el('customer').value='';el('phone').value='';el('contact').value='';el('notes').value='Thank you for your business.';el('date').value=new Date().toISOString().slice(0,10);nextNum();el('services').innerHTML='';addService();calc();window.scrollTo(0,0)}
el('addService').addEventListener('click',function(){addService()});el('save').addEventListener('click',save);el('print').addEventListener('click',function(){window.print()});el('new').addEventListener('click',fresh);fresh();render();
})();
</script></body></html>
